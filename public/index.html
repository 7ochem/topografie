<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topo Oefenen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Crimson+Pro:ital,wght@1,500;1,600&display=swap">
<link rel="stylesheet" href="css/topo.css">
<script src="js/packs.js" defer></script>
<script src="js/game.js" defer></script>
<script src="js/shell.js" defer></script>
</head>
<body>
<div id="chooser" class="chooser" hidden></div>
<div id="app" hidden>
  <header class="top">
    <button class="back" id="backbtn" aria-label="Andere kaart kiezen" title="Andere kaart kiezen"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kaarten</span></button>
    <div class="tab"><div class="num" id="chap">3</div><div class="tt"><b id="pseries">Topografie</b><span id="ptitle"></span></div></div>
    <div class="scorewrap">
      <button class="score" id="scorebtn" aria-label="Voortgang" title="Bekijk voortgang"><span class="s">★</span><span id="stars">0 / 37</span></button>
      <button class="scorego" id="scorego"><span class="long">Bekijk voortgang</span><span class="short">Voortgang</span></button>
    </div>
    <nav class="modes" id="modes" aria-label="Spelmodus">
      <button data-mode="verkennen">Bekijken</button>
      <button data-mode="wat">Wat is dit?</button>
      <button data-mode="waar">Waar ligt…?</button>
      <button data-mode="toets">Proeftoets</button>
    </nav>
  </header>
  <main class="stage">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Topografiekaart"></svg>
      <div class="zoomctl">
        <button id="zin" aria-label="Inzoomen" title="Inzoomen (+)">+</button>
        <button id="zout" aria-label="Uitzoomen" title="Uitzoomen (−)">−</button>
        <button id="zfit" aria-label="Hele kaart" title="Hele kaart (0)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5"/></svg></button>
      </div>
      <div class="toast" id="toast" hidden></div>
      <div class="tip" id="tip" hidden></div>
      <div class="fxl" id="fxl" aria-hidden="true"></div>
      <div class="credit" id="credit"></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
</div>

<div class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="helpT" hidden>
  <div class="help-card" tabindex="-1">
    <button class="help-x" id="helpX" aria-label="Sluiten">×</button>
    <div class="eyebrow">Zo werkt het</div>
    <h2 id="helpT"></h2>
    <div id="helpB"></div>
    <div class="help-foot"><button class="btn primary" id="helpOk">Ok</button></div>
  </div>
</div>
</body>
</html>
