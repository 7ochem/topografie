<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topo Noord- & Midden-Amerika</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Crimson+Pro:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: a worksheet lying on a desk. Map sheet fills the stage, the question card sits below (phone) or beside it (wide). */
:root {
  --desk: #dedbd3;
  --paper: #fdfdfb;
  --ink: #1b1b19;
  --muted: #66655f;
  --line: #c8c5bc;
  --sea: #e7e7e2;
  --stip: #8c8b84;
  --greyland: #cfcec8;
  --card: #f8f7f3;
  --hi: #ff5f1f;
  --hi-soft: rgba(255, 95, 31, .28);
  --good: #2b8a3e;
  --good-soft: #e3f3e6;
  --bad: #c92a2a;
  --bad-soft: #fbe6e6;
  --star: #f2b705;
  --font-ui: "Century Gothic", "Didact Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-title: "Crimson Pro", "Iowan Old Style", Georgia, serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }

/* Header: black chapter tab like the textbook */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tab { display: flex; align-items: stretch; min-width: 0; flex: 0 1 auto; }
.back { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 10px 0 6px; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 14px; }
.back svg { width: 20px; height: 20px; }
@media (max-width: 420px) { .back span { display: none; } .back { padding: 0 8px; } }
@media (hover: hover) { .back:hover { background: var(--paper); border-color: var(--ink); } }

/* Start screen */
.chooser {
  min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px;
  max-width: 900px; margin: 0 auto;
}
.ch-head { padding-top: 8px; }
.ch-head h1 { font: italic 600 40px/1.05 var(--font-title); margin: 0; display: inline-block; border-bottom: 5px solid var(--ink); padding-right: 24px; }
.ch-head p { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
.ch-group h2 { font: italic 600 26px/1.1 var(--font-title); margin: 0 0 10px; }
.ch-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ch-card {
  display: flex; gap: 14px; align-items: center; text-align: left; padding: 12px; background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.ch-inset { width: 96px; height: 110px; flex: none; background: var(--card); border: 1px solid var(--line); }
.ch-land { fill: #dedcd5; stroke: #6d6c66; stroke-width: .6; }
.ch-hi { fill: #55544f; stroke: #2a2a27; stroke-width: .6; }
.ch-txt { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; min-width: 0; flex: 1; }
.ch-num { background: var(--ink); color: var(--paper); font: 700 20px/1 var(--font-ui); width: 32px; height: 34px; display: grid; place-items: center; }
.ch-title { font: italic 600 22px/1.1 var(--font-title); text-wrap: balance; }
.ch-prog { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
.ch-prog .bar { flex: 1; margin-left: 6px; }
@media (hover: hover) { .ch-card:hover { border-color: var(--ink); } }
.tab .num {
  background: var(--ink); color: var(--paper); font: 700 26px/1 var(--font-ui);
  display: grid; place-items: center; width: 38px; height: 40px; flex: none;
}
.tab .tt { display: flex; flex-direction: column; justify-content: center; padding-left: 8px; border-bottom: 4px solid var(--ink); min-width: 0; }
.tab .tt b { font: italic 600 20px/1.05 var(--font-title); }
.tab .tt span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { margin-left: auto; display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; font-size: 15px; background: var(--paper); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; }
.score .lbl { font-size: 13px; color: var(--muted); }
.score[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.score[aria-pressed="true"] .lbl { color: var(--paper); }
@media (max-width: 520px) { .score .lbl { display: none; } }
.score .s { color: var(--star); font-size: 17px; }

nav.modes { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1 1 100%; }
nav.modes::-webkit-scrollbar { display: none; }
nav.modes button {
  flex: 1 0 auto; border: 1px solid var(--line); background: var(--card); padding: 7px 6px; border-radius: 6px;
  font-size: 14px; white-space: nowrap;
}
@media (max-width: 420px) { nav.modes button { font-size: 13px; padding: 7px 4px; } }
nav.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Stage */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.mapwrap { position: relative; flex: 1; min-height: 200px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.08); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
/* Source of the map data, small in the corner like on web maps */
.credit { position: absolute; left: 0; bottom: 0; max-width: calc(100% - 60px); padding: 2px 6px; font-size: 10px; line-height: 1.3; color: var(--muted); background: rgba(253, 253, 251, .8); border-top-right-radius: 4px; z-index: 2; }
.credit:empty { display: none; }
.credit a { color: inherit; }
.zoomctl { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button { width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); font-size: 20px; line-height: 1; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.zoomctl svg { width: 18px; height: 18px; }
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--ink); color: var(--paper);
  padding: 6px 12px; border-radius: 999px; font-size: 14px; pointer-events: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
}

.panel {
  flex: none; max-height: 46%; overflow: auto; background: var(--card); border: 1px solid var(--line);
  padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
}
@media (min-width: 860px) and (min-aspect-ratio: 1/1) {
  .stage { flex-direction: row; }
  .panel { width: 380px; max-height: none; }
}

/* Panel content */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.qtitle { font: italic 600 26px/1.1 var(--font-title); margin: 0; text-wrap: balance; }
.big { font-size: 24px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; }
.chip.cat { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 700; }
.btn { border: 1px solid var(--ink); background: var(--paper); padding: 9px 14px; border-radius: 8px; font-size: 15px; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.ghost { border-color: var(--line); }
.btn.hint { border-style: dashed; border-color: var(--muted); }
.btn.giveup { border-color: var(--muted); color: var(--ink); }
/* Hint button with a short line of what it does */
.hintbtn { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.hb-main { display: inline-flex; align-items: center; gap: 4px; }
.hb-sub { color: var(--muted); font-size: 13px; }
/* On/off switch (Bekijken: Namen, Kleuren) */
.tgl { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 14px; color: var(--ink); }
.tgl-track { position: relative; width: 30px; height: 18px; border-radius: 999px; background: var(--line); transition: background .15s; flex: none; }
.tgl-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.tgl[aria-checked="true"] .tgl-track { background: var(--good); }
.tgl[aria-checked="true"] .tgl-knob { transform: translateX(12px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.grow { flex: 1 1 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts button { border: 1px solid var(--ink); background: var(--paper); border-radius: 8px; padding: 10px 8px; font-size: 15px; min-height: 46px; }
.opts button.gone { text-decoration: line-through; opacity: .35; }
.opts button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opts button.right { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
.answer { display: flex; gap: 8px; }
.answer input { flex: 1; min-width: 0; border: 1px solid var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 17px; background: var(--paper); }
.pattern { font: 20px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; padding: 6px 10px; background: var(--paper); border: 1px dashed var(--muted); border-radius: 8px; overflow-x: auto; white-space: nowrap; }
.pattern .gap { display: inline-block; width: .9em; }
.fb { padding: 8px 12px; border-radius: 8px; font-size: 15px; }
.fb.good { background: var(--good-soft); color: var(--good); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb.info { background: var(--paper); border: 1px solid var(--line); }
.fb b { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 8px 14px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.toggles button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.muted { color: var(--muted); font-size: 13px; }
.streak { display: inline-flex; gap: 3px; vertical-align: middle; }
.streak i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; box-sizing: border-box; }
.streak i.on { background: var(--good); border-color: var(--good); }
.starred { color: var(--star); }

/* Settings rows */
.setrow { display: grid; grid-template-columns: 9.5em auto; gap: 4px 10px; align-items: center; }
.setrow .muted { grid-column: 1 / -1; }
.setrow .seg { justify-self: start; }
@media (max-width: 380px) { .setrow { grid-template-columns: 1fr; } }

/* Round header: question number and live score */
.pl { display: flex; flex-direction: column; gap: 2px; }
.live { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.live b { color: var(--ink); }
.verdict { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--ink); padding: 8px 12px; border-radius: 6px; font-size: 14px; }

/* Volgende with a bar that shows it will go on by itself */
.nextbtn { position: relative; overflow: hidden; }
.autobar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--star); transform-origin: left; animation: autobar linear forwards; }
@keyframes autobar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .autobar { animation: none; transform: scaleX(1); opacity: .6; } }

/* Proeftoets */
.tlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.trow { display: flex; align-items: center; gap: 8px; }
.tnum { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.trow input { flex: 1; min-width: 0; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 6px 4px; font-size: 17px; border-radius: 0; }
.trow input:focus { outline: none; border-bottom-color: var(--hi); background: var(--paper); }
.trow:focus-within .tnum { background: var(--ink); color: var(--paper); }
.graded .trow { align-items: flex-start; padding: 4px 0; border-bottom: 1px solid var(--line); }
.tans { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 16px; }
.tans small { font-size: 13px; color: var(--muted); }
.tans small b { color: var(--ink); }
.tmark { flex: none; width: 28px; text-align: center; font-weight: 700; font-size: 18px; }
.trow.ok .tmark { color: var(--good); }
.trow.half .tmark { color: #b7791f; }
.trow.bad .tmark { color: var(--bad); }
.scorebox { display: flex; align-items: baseline; gap: 8px; font-size: 16px; }
.scorebox b { font: italic 600 44px/1 var(--font-title); }

/* Names of buttons and keys inside text */
.ui { display: inline-block; border: 1px solid var(--ink); border-radius: 6px; padding: 0 7px; background: var(--paper); font-size: .92em; line-height: 1.45; white-space: nowrap; }
.key { display: inline-block; font: 600 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 0 5px; border: 1px solid var(--muted); border-bottom-width: 2px; border-radius: 4px; background: var(--paper); }

/* Progress of one name: three dots that lead to a star */
.track { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.track i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; }
.track i.on { background: var(--good); border-color: var(--good); }
.track b { font-size: 18px; line-height: 1; color: var(--line); margin-left: 1px; }
.track b.on { color: var(--star); }
.starline { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; }
.starline .track { margin-top: 1px; }
.starline.won { background: #fff6d8; border: 1px solid #f0d36a; padding: 8px 12px; border-radius: 8px; }

/* Round summary */
.sumgroup { display: flex; flex-direction: column; gap: 6px; }
.sumhead { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sw-perfect { background: var(--good); }
.sw-helped { background: var(--star); }
.sw-fail { background: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Worksheet list (Verkennen + Voortgang) */
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 16px; }
.sheet h3 { margin: 0 0 4px; font-size: 13px; letter-spacing: .06em; }
.sheet ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.sheet li button { border: 0; background: none; padding: 3px 4px; width: 100%; text-align: left; border-radius: 4px; display: flex; gap: 6px; align-items: center; font-size: 15px; }
.sheet li button[aria-current="true"] { background: var(--hi-soft); }
.sheet li button .st { margin-left: auto; font-size: 13px; }
.bar { height: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.prog { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-variant-numeric: tabular-nums; }
.list-res { margin: 0; padding-left: 18px; }

/* Mouse / touchpad */
#map { cursor: grab; }
#map[data-cur="pointer"] { cursor: pointer; }
#map[data-cur="crosshair"] { cursor: crosshair; }
#map.dragging { cursor: grabbing; }
.tip {
  position: absolute; z-index: 2; pointer-events: none; background: var(--ink); color: var(--paper);
  padding: 4px 10px; border-radius: 6px; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.2);
}
.tip small { margin-left: 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.tip[hidden] { display: none; }
.kbd { display: none; }
@media (hover: hover) and (pointer: fine) {
  .kbd {
    display: inline-block; font: 600 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 0 5px;
    border: 1px solid currentColor; border-radius: 4px; opacity: .55; margin-left: 8px; vertical-align: 1px;
  }
  .opts .kbd { margin: 0 8px 0 0; }
}
@media (hover: hover) {
  nav.modes button:not([aria-pressed="true"]):hover, .score:not([aria-pressed="true"]):hover { background: var(--paper); border-color: var(--ink); }
  .btn:not(.primary):not(.good):not(.bad):not(:disabled):hover { background: var(--card); }
  .btn.primary:not(:disabled):hover { background: #3a3a36; }
  .btn.good:not(:disabled):hover, .btn.bad:not(:disabled):hover { filter: brightness(1.1); }
  .opts button:not(:disabled):hover { background: #fff1e8; border-color: var(--hi); }
  .toggles button:not([aria-pressed="true"]):hover, .seg button:not([aria-pressed="true"]):hover { background: #efede7; }
  .sheet li button:not([aria-current="true"]):hover { background: rgba(27, 27, 25, .06); }
  .zoomctl button:hover { background: var(--card); border-color: var(--ink); }
  .tgl:hover { border-color: var(--ink); }
  button.chip:hover { border-color: var(--ink); }
}

/* Larger on a laptop screen */
@media (min-width: 1100px) and (min-aspect-ratio: 1/1) {
  body { font-size: 16px; }
  .panel { width: 440px; padding: 16px 18px; gap: 12px; }
  .qtitle { font-size: 30px; }
  .big { font-size: 28px; }
  .btn, .opts button, .answer input { font-size: 17px; }
  .opts button { min-height: 54px; }
  nav.modes button { font-size: 15px; padding: 8px 10px; }
  .sheet li button { font-size: 16px; }
  .muted { font-size: 14px; }
  .chip { font-size: 14px; }
}
@media (min-width: 1500px) and (min-aspect-ratio: 1/1) {
  .panel { width: 500px; }
}

/* Emoji feedback */
.fxl { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; opacity: .9; } /* emoji on the map: a little see-through */
.fxring { position: absolute; border-radius: 50%; border: 4px solid #ff8a2b; box-sizing: border-box; will-change: transform, opacity; }
.fxemo, .emo, .emo-t { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; line-height: 1; }
.fxemo { position: absolute; will-change: transform, opacity; }
.fb .emo { display: inline-block; font-size: 22px; margin-right: 8px; vertical-align: -3px; animation: emoIn .45s cubic-bezier(.3, 1.6, .5, 1); }
.emo-t { font-size: .9em; font-style: normal; }
@keyframes emoIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .fb .emo { animation: none; } }

/* Uitleg-overlay */
.help {
  position: fixed; inset: 0; z-index: 20; background: rgba(27, 27, 25, .5);
  display: flex; align-items: center; justify-content: center; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
}
.help[hidden] { display: none; }
.help-card {
  position: relative; width: 100%; max-width: 440px; max-height: 100%; overflow: auto; box-sizing: border-box;
  background: var(--paper); border: 1px solid var(--ink); border-radius: 10px; padding: 18px 20px 20px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .25);
}
.help-x {
  position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; background: none;
  font-size: 28px; line-height: 1; border-radius: 6px; display: grid; place-items: center;
}
.help-x:hover { background: var(--card); }
.help-card:focus { outline: none; }
.help h2 { font: italic 600 28px/1.1 var(--font-title); margin: 2px 40px 10px 0; text-wrap: balance; }
.help .lead { margin: 0 0 10px; font-size: 16px; }
.help ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
.legend { margin-top: 12px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.legend-t { font-weight: 700; margin-bottom: 2px; }
.legend-s { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.lgrid { display: grid; grid-template-columns: auto auto auto 1fr; gap: 8px 8px; align-items: center; font-size: 14px; }
.lgrid .arr { color: var(--muted); }
.lgrid.two { grid-template-columns: auto 1fr; }
/* Laptop and bigger: a wider card, the list and the example side by side, so it is not so long */
@media (min-width: 900px) and (min-height: 500px) {
  .help-card { max-width: 780px; padding: 22px 26px 24px; }

  #helpB > .lead { grid-column: 1 / -1; }
  #helpB > .lead + ul:last-child { grid-column: 1 / -1; }
  #helpB > .legend { margin-top: 0; }
}

/* Map art */
#map .sea { fill: url(#pSea); }
#map .sea.plain { fill: var(--paper); }
#map .heavy { fill: none; stroke: var(--ink); stroke-width: 2.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#map .scalebar path { fill: none; stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#map .scalebar text { font: 13px var(--font-ui); fill: var(--ink); }
#map .greyc { fill: url(#pGrey); }
#map .land { fill: var(--paper); }
#map .lakes { fill: #f1f1ee; stroke: var(--ink); stroke-width: .8; vector-effect: non-scaling-stroke; }
#map .coast, #map .borders { fill: none; stroke: var(--ink); stroke-width: .9; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#map .dashed { fill: none; stroke: var(--ink); stroke-width: .9; stroke-dasharray: 3 2.2; }
#map .river { fill: none; stroke: var(--ink); stroke-width: .9; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
#map .canal { fill: none; stroke: transparent; stroke-width: 2; vector-effect: non-scaling-stroke; }
#map .caret { fill: none; stroke: var(--ink); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
#map .city { fill: var(--ink); }
#map .frame { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
#map .watr { fill: transparent; }
#map .st { fill: transparent; }
#map .maptitle { font: italic 500 30px var(--font-title); fill: var(--ink); }
#inset { transition: opacity .25s; }
#map .inset-bg { fill: var(--paper); stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
#map .inset-land { fill: #dedcd5; stroke: #6d6c66; stroke-width: .5; vector-effect: non-scaling-stroke; }
#map .inset-na { fill: #55544f; stroke: #2a2a27; stroke-width: .5; vector-effect: non-scaling-stroke; }

#map #inset.light .inset-land { fill: #f1f0ec; stroke: var(--ink); stroke-width: .8; }
#map #inset.light .inset-na { fill: #8f8e88; stroke: var(--ink); stroke-width: .6; }

#map.colors .done.river, #map.colors .done.canal { stroke: #1c7ed6; stroke-width: 2.2; }

#map.colors .mtn.done .caret { stroke: #8a5a2b; stroke-width: 1.6; }

#map .num text { fill: var(--ink); font-family: var(--font-ui); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
#map .num line { stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }

#map .num.act text { fill: var(--paper); }
#map .num.g-ok circle { stroke: var(--good); stroke-width: 3; }
#map .num.g-half circle { stroke: #d69e2e; stroke-width: 3; }
#map .num.g-bad circle { stroke: var(--bad); stroke-width: 3; }

/* Mouse hover (Verkennen) */
#map .hov.ctry, #map .hov.st { fill: var(--hi); fill-opacity: .18; }
#map .hov.watr { fill: var(--hi); fill-opacity: .1; }
#map .hline { fill: none; stroke: var(--hi); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .65; }
#map .hring { fill: none; stroke: var(--hi); stroke-width: 2; vector-effect: non-scaling-stroke; }
#map .mtnhov { fill: var(--hi); fill-opacity: .12; }

/* Question highlight: marker pen */
#map .q.ctry, #map .q.st { fill: var(--hi); fill-opacity: .55; animation: pulseFill 1.4s ease-in-out infinite; }
#map .q.watr { fill: var(--hi); fill-opacity: .25; }
#map .mtn.q .caret { stroke: var(--hi); stroke-width: 1.8; }
#map .sel.ctry, #map .sel.st { fill: var(--hi); fill-opacity: .4; }
#map .sel.watr { fill: var(--hi); fill-opacity: .2; }
#map .mtn.sel .caret { stroke: var(--hi); stroke-width: 1.8; }
#map .qline { fill: none; stroke: var(--hi); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .9; }
#map .ring { fill: none; stroke: var(--hi); stroke-width: 3; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: pulseRing 1.4s ease-in-out infinite; }
#map .mtnhi { fill: var(--hi); fill-opacity: .18; }
#map .qmark { fill: var(--hi); }
#map .qmark-t { fill: #fff; font: 700 14px var(--font-ui); text-anchor: middle; dominant-baseline: central; }
#map .blink { animation: blink .5s steps(2, jump-none) 6; }
#map .labels text { font-family: var(--font-ui); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-linejoin: round; }
#map .labels text.lc { font-weight: 700; letter-spacing: .08em; }
#map .labels text.ls { font-style: italic; font-weight: 700; letter-spacing: .04em; }
#map .labels text.lw { font-style: italic; fill: #1c5f99; }
#map .labels text.lg { font-style: italic; font-weight: 700; fill: #7a4b1e; }
#map .labels text.sol { fill: var(--hi); font-weight: 700; }
@keyframes pulseFill { 50% { fill-opacity: .25; } }
@keyframes pulseRing { 50% { transform: scale(1.35); opacity: .55; } }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {

'use strict';

const $ = s => document.querySelector(s);

ITEMS.forEach((it, i) => { it.color = PALETTE[i % PALETTE.length]; });
const STORE = 'topo:' + PACK.id + ':v1';
const FINE = !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function load() {
  try { const v = JSON.parse(localStorage.getItem(STORE) || 'null'); if (v && v.items) return v; } catch (e) { /* storage blocked */ }
  return { items: {}, prefs: {} };

const BOXW = { 1: 8, 2: 4, 3: 2, 4: 1 };
function pickQueue(pool, n) {

  const out = [];

    const tot = bag.reduce((a, b) => a + b.w, 0);
    let r = Math.random() * tot, i = 0;
    for (; i < bag.length - 1; i++) { r -= bag[i].w; if (r <= 0) break; }
    out.push(bag.splice(i, 1)[0].id);

}

  if (outcome === 'helped') { s.good++; }

// Edit distance where swapping two neighbouring letters counts as one mistake
function lev(a, b) {

    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

  if (!queue.length) { toast('Er is niets om te oefenen met deze keuze'); return; }

  }

    if (!hits.length) { state.sel = null; state.selAlso = []; setHl(null); render(); toast('Hier ligt niets van je lijst'); return; }

}
function catToggles(sel, act) {
  return `<div class="toggles">${PACK.cats.map(c => `<button data-act="${act}" data-cat="${c.id}" aria-pressed="${sel.includes(c.id)}">${esc(c.plural)} <span class="muted">${ITEMS.filter(i => i.cat === c.id).length}</span></button>`).join('')}</div>`;
}
function lenToggles(cur, act) {
  return `<div class="toggles">${[[10, '10 vragen'], [20, '20 vragen'], [0, 'Alles']].map(([v, l]) => `<button data-act="${act}" data-len="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
}

function render() {
  const m = state.mode;
  if (m === 'verkennen') return renderVerkennen();
  if (m === 'voortgang') return renderVoortgang();
  const r = state.rounds[m];
  if (!r || state.setupOpen[m]) return renderSetup(m);
  if (r.over) return renderSummary(r);
  if (m === 'wat') return renderWat(r);
  if (m === 'waar') return renderWaar(r);
  if (m === 'toets') return renderToets(r);
}

function renderVerkennen() {
  const id = state.sel, it = id && BY[id];
  let info = '';
  if (it) {
    info = `<div class="row"><div class="big">${esc(it.name)}</div>${catChip(it)}</div>${starLine(id)}`;
    if (state.selAlso.length) info += `<div class="row muted">Hier ligt ook: ${state.selAlso.map(o => `<button class="chip" data-act="pick" data-id="${o}">${esc(BY[o].name)}</button>`).join(' ')}</div>`;
  } else {
    info = FINE
      ? '<p class="muted" style="margin:0">Ga met de muis over de kaart of over een naam om te zien wat het is en waar het ligt.</p>'
      : '<p class="muted" style="margin:0">Tik op de kaart of op een naam om te zien wat het is en waar het ligt. Knijp om te zoomen.</p>';
  }
  panel.innerHTML = `
    <div class="row between"><span class="eyebrow">Bekijken</span>
      <span class="row" style="gap:6px">${toggleHtml('labels', 'Namen', showAllLabels)}${toggleHtml('colors', 'Kleuren', colorsOn())}</span></div>
    ${info}
    ${sheetHtml(false)}`;
}
// On/off switch, e.g. for Namen and Kleuren in Bekijken
const toggleHtml = (act, label, on) => `<button class="tgl" role="switch" data-act="${act}" aria-checked="${on}"><span class="tgl-track"><span class="tgl-knob"></span></span>${label}</button>`;
function sheetHtml(progressView) {
  return `<div class="sheet">${PACK.cats.map(c => `<div><h3>${esc(c.plural.toUpperCase())}</h3><ul>${ITEMS.filter(i => i.cat === c.id).map(i =>
    `<li><button data-act="pick" data-id="${i.id}" aria-current="${state.sel === i.id && !progressView}"><span>${esc(i.name)}</span><span class="st">${progressView ? streakHtml(i.id) : (isMastered(i.id) ? '<span class="starred">★</span>' : '')}</span></button></li>`).join('')}</ul></div>`).join('')}</div>`;
}

function renderSetup(m) {
  const p = P[m];
  let body = '';
  if (m === 'wat') {
    body = `<p class="qtitle">Wat is dit?</p>
      <p class="muted" style="margin:0">Er licht iets op de kaart op. Weet jij hoe het heet?</p>
      <div class="row"><span class="seg"><button data-act="type" data-type="mc" aria-pressed="${p.type === 'mc'}">Kies uit 4</button><button data-act="type" data-type="typen" aria-pressed="${p.type === 'typen'}">Zelf typen</button></span></div>
      ${catToggles(p.cats, 'cat')}${lenToggles(p.len, 'len')}`;
  } else if (m === 'waar') {
    body = `<p class="qtitle">Waar ligt…?</p>
      <p class="muted" style="margin:0">Je krijgt een naam en ${FINE ? 'klikt' : 'tikt'} de plek aan op de kaart. Dit telt niet mee voor je sterren.</p>
      ${catToggles(p.cats, 'cat')}${lenToggles(p.len, 'len')}`;
  } else {
    body = `<p class="qtitle">Proeftoets</p>
      <p class="muted" style="margin:0">${TOETS_N} vragen, zoals op de echte toets. Op de kaart staan nummers; je schrijft bij elk nummer de naam.</p>
      ${catToggles(p.cats, 'cat')}`;
  }
  const spellRow = `<div class="setrow"><span>Spelling</span><span class="seg"><button data-act="spell" data-v="streng" aria-pressed="${spelling() === 'streng'}">Streng</button><button data-act="spell" data-v="soepel" aria-pressed="${spelling() === 'soepel'}">Soepel</button></span>
      <span class="muted">${spelling() === 'streng' ? 'Alles precies goed, ook hoofdletters. In de Proeftoets is een spelfout een halve punt eraf.' : 'Een kleine spelfout mag, als het er duidelijk op lijkt.'}</span></div>`;
  if (m === 'toets' || (m === 'wat' && p.type === 'typen')) body += spellRow;
  body += `<div class="row" style="gap:6px">${m === 'wat' || m === 'waar' ? toggleHtml('auto', 'Automatisch verder', autoOn()) : ''}${toggleHtml('emoji', "Emoji's", emojiOn())}</div>`;
  const canBack = state.rounds[m] && !state.rounds[m].over;
  panel.innerHTML = `${body}<div class="row"><button class="btn primary" data-act="go">Start</button>${canBack ? '<button class="btn ghost" data-act="resume">Terug naar de ronde</button>' : ''}</div>`;
}

function progressLine(r) {
  const t = r.tally;
  return `<div class="row between"><div class="pl"><span class="eyebrow">Vraag ${Math.min(r.i + 1, r.queue.length)} van ${r.queue.length}</span>
    <span class="live">Goed <b>${t.perfect}</b> · Met hulp <b>${t.helped + t.wrongfix}</b> · Fout <b>${t.fail}</b></span></div>
    <button class="btn ghost" data-act="setup" style="padding:4px 10px;font-size:13px">Instellingen</button></div>`;
}
function feedbackHtml(r) {
  const c = r.cur, it = BY[c.id];
  if (!c.done) return c.fb ? `<div class="fb ${c.fb.cls}">${emoHtml(c.fbEmo)}${c.fb.html}</div>` : '';
  const counts = r.mode !== 'waar';
  const name = `<b>${esc(it.name)}</b>`, note = c.note ? ' ' + c.note : '';
  let msg = c.outcome === 'fail'
    ? `<div class="fb info">${emoHtml(c.emo)}Het is ${name}.</div>`
    : `<div class="fb good">${emoHtml(c.emo)}${c.outcome === 'perfect' ? 'Goed zo!' : 'Goed!'} Het is ${name}.${note}</div>`;
  if (counts) {
    if (c.star) {
      msg += `<div class="starline won">${trackHtml(c.id)}<span><b>${esc(it.name)} heeft nu een ster!</b> Je had het 3 keer achter elkaar goed. ${colouredWhere(c.id)}</span></div>`;
    } else {
      const why = {
        perfect: '',
        helped: 'Met een hint telt het niet mee. ',
        wrongfix: 'Je had eerst een fout, dus je begint weer bij 0. ',
        fail: `Je wist het nog niet, dus je begint weer bij 0.${r.mode === 'wat' ? ' Deze vraag komt zo nog een keer terug.' : ''} `,
      }[c.outcome];
      msg += starLine(c.id, why);
    }
  }
  const bar = c.autoMs && r.autoT ? `<span class="autobar" style="animation-duration:${c.autoMs}ms"></span>` : '';
  return msg + `<div class="row" style="justify-content:flex-end"><button class="btn primary nextbtn" id="btn-next" data-act="next">Volgende${K('Enter')}${bar}</button></div>`;
}

// Hint button with what it will do. label null = last step: show the answer
function hintHtml(label, text) {
  const main = label ? `<span aria-hidden="true">💡</span> ${label}` : 'Ik weet het niet';
  return `<div class="row"><button class="btn hintbtn ${label ? 'hint' : 'giveup'}" data-act="hint"><span class="hb-main">${main}${K('H')}</span><span class="hb-sub">${text}</span></button></div>`;
}
function renderWat(r) {
  const c = r.cur, it = BY[c.id];
  const typing = P.wat.type === 'typen' && !c.asMc;
  let ask = '';
  if (!c.done) {
    if (typing) {
      ask = (c.hint >= 1 ? `<div class="pattern" aria-label="Hint: begint met ${esc([...it.name].slice(0, 2).join(''))}, ${[...it.name].filter(ch => /[^\s-]/.test(ch)).length} letters">${patternHtml(it.name)}</div>` : '') +
        `<form class="answer" data-act="typed" autocomplete="off"><input id="ans" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Typ de naam" value="${esc(c.typed)}" aria-label="Jouw antwoord"><button class="btn primary" type="submit">Check</button></form>`;
    } else {
      ask = `<div class="opts">${c.opts.map(o => `<button data-act="opt" data-id="${o}" class="${c.gone.includes(o) ? 'gone' : ''} ${c.wrongOpts.includes(o) ? 'wrong' : ''}" ${c.gone.includes(o) || c.wrongOpts.includes(o) ? 'disabled' : ''}>${K(c.opts.indexOf(o) + 1)}${esc(BY[o].name)}</button>`).join('')}</div>`;
    }
    if (typing) ask += hintHtml(c.hint === 0 ? 'Geef een hint' : 'Geef nog een hint', c.hint === 0 ? 'Je ziet de eerste 2 letters.' : 'Je kiest dan uit 4 namen.');
    else if (!c.asMc && c.hint === 0) ask += hintHtml('Geef een hint', 'Er worden 2 namen weggestreept.');
    else ask += hintHtml(null, 'Dan laten we het antwoord zien.');
  }
  panel.innerHTML = `${progressLine(r)}
    <div class="row"><p class="qtitle">Wat is dit?</p>${catChip(it)}</div>
    ${ask}${feedbackHtml(r)}`;
}
function renderWaar(r) {
  const c = r.cur, it = BY[c.id];
  const hint = [['Geef een hint', 'De kaart zoomt in op het goede stuk.'], ['Geef nog een hint', 'Het goede antwoord gaat knipperen.'], [null, 'Dan laten we zien waar het ligt.']][Math.min(c.hint, 2)];
  panel.innerHTML = `${progressLine(r)}
    <div class="row"><p class="qtitle">Waar ligt ${esc(it.name)}?</p>${catChip(it)}</div>
    ${c.done ? '' : `<p class="muted" style="margin:0">${FINE ? 'Klik' : 'Tik'} de plek aan op de kaart.</p>${hintHtml(...hint)}`}
    ${feedbackHtml(r)}`;
}
function renderToets(r) {
  const head = `<div class="row between"><span class="eyebrow">${r.items.length} vragen · spelling ${spelling()}</span><button class="btn ghost" data-act="setup" style="padding:4px 10px;font-size:13px">Instellingen</button></div>`;
  if (!r.graded) {
    const empty = r.items.filter(id => !(r.answers[id] || '').trim()).length;
    panel.innerHTML = `${head}
      <p class="qtitle">Proeftoets</p>
      <p class="muted" style="margin:0">Schrijf bij elk nummer de naam.</p>
      <form class="tlist" data-act="toetsform" autocomplete="off">${r.items.map((id, i) => `<label class="trow"><span class="tnum">${i + 1}</span>
        <input id="t${i}" data-ti="${i}" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="${i < r.items.length - 1 ? 'next' : 'done'}" value="${esc(r.answers[id] || '')}" aria-label="Antwoord ${i + 1}"></label>`).join('')}</form>
      ${r.warned && empty ? `<div class="fb info">Je hebt nog ${empty === 1 ? '1 lege regel' : empty + ' lege regels'}. Een lege regel telt als fout.</div>` : ''}
      <div class="row"><button class="btn primary" id="btn-grade" data-act="grade">${r.warned && empty ? 'Toch nakijken' : 'Nakijken'}</button></div>`;
    return;
  }
  const n = r.items.length, pct = r.score / n;
  const msg = pct === 1 ? 'Alles goed! Je bent klaar voor de toets.' : pct >= 0.8 ? 'Bijna klaar voor de toets.' : pct >= 0.55 ? 'Goed op weg. Oefen je fouten nog een keer.' : 'Nog even oefenen. Begin met Bekijken.';
  const wrong = r.items.filter((id, i) => r.graded[i].pts < 1);
  const stars = r.stars.map(id => BY[id].name);
  panel.innerHTML = `${head}
    <p class="qtitle">Nagekeken${pct === 1 && emojiOn() ? ' <span class="emo-t" aria-hidden="true">🏆</span>' : ''}</p>
    <div class="scorebox"><span>Score</span><b>${fmtPts(r.score)}</b><span>van ${n}</span></div>
    ${verdictHtml(msg)}
    ${stars.length ? `<div class="starline won"><span class="starred" style="font-size:20px">★</span><span><b>${stars.length === 1 ? 'Nieuwe ster' : 'Nieuwe sterren'} voor ${esc(joinNl(stars))}!</b></span></div>` : ''}
    <ol class="tlist graded">${r.items.map((id, i) => {
      const g = r.graded[i], cls = g.pts === 1 ? 'ok' : g.pts ? 'half' : 'bad';
      const mark = g.pts === 1 ? '✓' : g.pts ? '½' : '✗';
      const typed = (r.answers[id] || '').trim();
      const fix = g.pts < 1 ? (g.note || `Het is <b>${esc(BY[id].name)}</b>.`) : (g.note || '');
      return `<li class="trow ${cls}"><span class="tnum">${i + 1}</span><span class="tans">${typed ? esc(typed) : '<span class="muted">leeg</span>'}${fix ? `<small>${fix}</small>` : ''}</span><span class="tmark" aria-label="${g.pts} punt">${mark}</span></li>`;
    }).join('')}</ol>
    <div class="row">
      ${wrong.length ? `<button class="btn primary" data-act="practice-toets">Oefen je fouten in Wat is dit?</button>` : ''}
      <button class="btn ${wrong.length ? 'ghost' : 'primary'}" data-act="go">Nog een keer</button>
      <button class="btn ghost" data-act="setup">Aanpassen</button>
    </div>`;
  r.practice = wrong;
}
function renderSummary(r) {
  // Group the names by how they went (last answer per name)
  const by = { perfect: [], helped: [], fail: [] };
  Object.entries(r.res).forEach(([id, o]) => by[o === 'wrongfix' ? 'helped' : o].push(id));
  const labels = { perfect: 'In één keer goed', helped: 'Goed met een hint of na een fout', fail: 'Antwoord bekeken' };
  const groups = ['perfect', 'helped', 'fail'].filter(k => by[k].length).map(k => `
    <div class="sumgroup"><div class="sumhead"><span class="sw sw-${k}"></span>${labels[k]} <span class="muted">(${by[k].length})</span></div>
      <div class="chips">${by[k].map(id => `<span class="chip">${esc(BY[id].name)}${isMastered(id) ? ' <span class="starred">★</span>' : ''}</span>`).join('')}</div></div>`).join('');
  const practice = by.helped.concat(by.fail);
  const pNames = practice.map(id => BY[id].name);
  const practiceLabel = practice.length <= 3 ? `Oefen ${esc(joinNl(pNames))} nog een keer` : `Oefen deze ${practice.length} nog een keer`;
  const stars = r.stars.map(id => BY[id].name);
  const starsHtml = stars.length ? `<div class="starline won"><span class="starred" style="font-size:20px">★</span><span><b>${stars.length === 1 ? 'Nieuwe ster' : 'Nieuwe sterren'} voor ${esc(joinNl(stars))}!</b> Bij ${UI('Bekijken')} ${stars.length === 1 ? 'is die' : 'zijn die'} nu ingekleurd.</span></div>` : '';
  const canPractice = practice.length && r.mode !== 'waar';
  const allGood = emojiOn() && !by.helped.length && !by.fail.length && by.perfect.length;
  panel.innerHTML = `<p class="qtitle">Ronde klaar${allGood ? ' <span class="emo-t" aria-hidden="true">🏆</span>' : ''}</p>
    ${starsHtml}
    ${groups}
    ${verdictHtml(readiness())}
    <div class="row">
      ${canPractice ? `<button class="btn primary" data-act="practice">${practiceLabel}</button>` : ''}
      <button class="btn ${canPractice ? 'ghost' : 'primary'}" data-act="go">Nog een keer</button>
      <button class="btn ghost" data-act="setup">Aanpassen</button>
    </div>`;
  r.practice = practice;
}
function renderVoortgang() {
  const rows = PACK.cats.map(c => {
    const ids = ITEMS.filter(i => i.cat === c.id).map(i => i.id), n = ids.filter(isMastered).length;
    return `<span>${esc(c.plural)}</span><div class="bar"><i style="width:${100 * n / ids.length}%"></i></div><b>${n}/${ids.length}</b>`;
  }).join('');
  const total = ITEMS.filter(i => isMastered(i.id)).length;
  panel.innerHTML = `<div class="row between"><p class="qtitle">Voortgang</p><span class="chip"><span class="starred">★</span> ${total} / ${ITEMS.length}</span></div>
    ${verdictHtml(readiness())}
    <div class="prog">${rows}</div>
    <p class="muted" style="margin:0">Achter elke naam staan bolletjes: ${dots(2)} betekent 2 keer achter elkaar goed. Bij 3 keer krijgt die naam een ster <span class="starred">★</span> en kleurt hij in op de kaart. ${UI('Wat is dit?')} en de ${UI('Proeftoets')} tellen mee, en alleen zonder hint.</p>
    ${sheetHtml(true)}
    <div class="row">${state.resetAsk
      ? '<span>Alle sterren en reeksen wissen?</span><button class="btn bad" data-act="reset-yes">Ja, wissen</button><button class="btn ghost" data-act="reset-no">Annuleren</button>'
      : '<button class="btn ghost" data-act="reset-ask">Voortgang wissen</button>'}</div>`;
}

/* ---------- Panel events ---------- */
on(panel, 'click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'FORM') return;
  const act = b.dataset.act, m = state.mode, r = state.rounds[m];
  if (act === 'pick') {
    const id = b.dataset.id;
    if (m === 'voortgang') { state.sel = id; setMode('verkennen'); focusItem(id, 320); return; }
    state.sel = id; state.selAlso = [];
    setHl({ id, style: 'sel' }); focusItem(id, 320); render(); return;
  }
  if (act === 'labels') { showAllLabels = !showAllLabels; prog.prefs.labels = showAllLabels; save(); renderLabels(); render(); return; }
  if (act === 'colors') { prog.prefs.colors = !colorsOn(); save(); applyColors(); render(); return; }
  if (act === 'emoji') { prog.prefs.emoji = !emojiOn(); save(); render(); return; }
  if (act === 'type') { P.wat.type = b.dataset.type; save(); render(); return; }
  if (act === 'spell') { prog.prefs.spelling = b.dataset.v; save(); render(); return; }
  if (act === 'auto') { prog.prefs.auto = !autoOn(); save(); render(); return; }
  if (act === 'grade') {
    const empty = r.items.filter(id => !(r.answers[id] || '').trim()).length;
    if (empty && !r.warned) { r.warned = true; render(); $('#btn-grade').focus(); return; }
    gradeToets(r); return;
  }
  if (act === 'practice-toets') { const ids = r.practice; setMode('wat', false); state.setupOpen.wat = false; startRound('wat', ids); openHelp('wat'); return; }
  if (act === 'cat') {
    const p = P[m], c = b.dataset.cat;
    p.cats = p.cats.includes(c) ? p.cats.filter(x => x !== c) : allCats.filter(x => p.cats.includes(x) || x === c);
    if (!p.cats.length) p.cats = [c];
    save(); render(); return;
  }
  if (act === 'len') { P[m].len = +b.dataset.len; save(); render(); return; }
  if (act === 'go') { state.setupOpen[m] = false; startRound(m); return; }
  if (act === 'resume') { state.setupOpen[m] = false; if (m === 'toets') { renderNums(); render(); return; } showQuestion(r, true); render(); return; }
  if (act === 'setup') { state.setupOpen[m] = true; if (r) { clearTimeout(r.autoT); r.autoT = null; } renderNums(); render(); return; }
  if (act === 'next') { nextQuestion(r); return; }
  if (act === 'opt') { answerWat(r, b.dataset.id); return; }
  if (act === 'hint') { (m === 'waar' ? hintWaar : hintWat)(r); return; }
  if (act === 'practice') { state.setupOpen.wat = false; startRound('wat', r.practice); return; }
  if (act === 'reset-ask') { state.resetAsk = true; render(); return; }
  if (act === 'reset-no') { state.resetAsk = false; render(); return; }
  if (act === 'reset-yes') { prog.items = {}; save(); state.resetAsk = false; refreshDone(); render(); toast('Voortgang gewist'); return; }
});
on(panel, 'pointerover', e => {
  if (e.pointerType !== 'mouse' || state.mode !== 'verkennen') return;
  const b = e.target.closest('[data-act=pick]');
  setHover(b ? b.dataset.id : null);
});
on(panel, 'pointerleave', () => { if (state.mode === 'verkennen') setHover(null); });
on(panel, 'submit', e => {
  e.preventDefault();
  if (state.mode === 'toets') return;
  const r = state.rounds.wat; const inp = $('#ans');
  if (r && inp) submitTyped(r, inp.value);
});
on(panel, 'input', e => {
  if (e.target.id === 'ans') { const r = state.rounds.wat; if (r && r.cur) r.cur.typed = e.target.value; }
  if (e.target.dataset.ti !== undefined) { const r = state.rounds.toets; if (r) r.answers[r.items[+e.target.dataset.ti]] = e.target.value; }
});
// Proeftoets: Enter goes to the next line; the number of the line being filled in lights up on the map
on(panel, 'keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset.ti === undefined) return;
  e.preventDefault();
  const next = $('#t' + (+e.target.dataset.ti + 1));
  if (next) next.focus(); else { const gb = $('#btn-grade'); gb && gb.focus(); }
});
on(panel, 'focusin', e => {
  if (e.target.dataset.ti === undefined) return;
  const r = state.rounds.toets; if (!r) return;
  r.active = +e.target.dataset.ti; renderNums();
});

/* ---------- Boot ---------- */
function boot(data) {
  try {
    if (data && data.rounds) { state.rounds = data.rounds; state.sel = data.sel || null; }
  } catch (e) { /* ignore */ }
  document.getElementById('chap').textContent = PACK.chapter;
  document.getElementById('ptitle').textContent = PACK.title;
  document.getElementById('pseries').textContent = 'Topografie ' + PACK.series;
  svg.setAttribute('aria-label', 'Topografiekaart ' + PACK.title);
  refreshDone();
  fitAll(false);
  const restored = !!(data && data.mode);
  const mode = restored && ['verkennen', 'wat', 'waar', 'toets', 'voortgang'].includes(data.mode) ? data.mode : 'verkennen';
  setMode(mode, !restored);
}
boot(restore || {});
window.__topo = { hitsAt, state, BY, M, view, upp };
return { snapshot: () => ({ mode: state.mode, rounds: state.rounds, sel: state.sel }) };
}

</script>
<script>
// Start screen: choose a map. Each map runs as its own game; going back stops it.
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const appEl = $('#app'), chooserEl = $('#chooser'), helpEl = $('#help');
const APP_HTML = appEl.innerHTML;
let current = null; // { id, ctrl, api }

function starsOf(pack) {
  let n = 0;
  try {
    const v = JSON.parse(localStorage.getItem('topo:' + pack.id + ':v1') || 'null');
    if (v && v.items) n = pack.items.filter(i => v.items[i.id] && v.items[i.id].streak >= 3).length;
  } catch (e) { /* storage blocked */ }
  return n;
}
function stop() {
  if (!current) return;
  current.ctrl.abort();
  current = null;
  helpEl.hidden = true;
}
function openPack(id, restore) {
  const entry = PACKS.find(p => p.pack.id === id);
  if (!entry) { showChooser(); return; }
  stop();
  chooserEl.hidden = true;
  appEl.innerHTML = APP_HTML;
  appEl.hidden = false;
  const ctrl = new AbortController();
  $('#backbtn').addEventListener('click', showChooser, { signal: ctrl.signal });
  const api = runGame(entry.pack, entry.map, ctrl.signal, restore);
  current = { id, ctrl, api };
}
function showChooser() {
  stop();
  appEl.hidden = true;
  appEl.innerHTML = '';
  const series = [...new Set(PACKS.map(p => p.pack.series))];
  chooserEl.innerHTML = `<div class="ch-head"><h1>Topografie</h1><p>Kies je kaart</p></div>
    ${series.map(s => `<section class="ch-group"><h2>${esc(s)}</h2><div class="ch-cards">${PACKS.filter(p => p.pack.series === s).map(({ pack, map }) => {
      const n = starsOf(pack), tot = pack.items.length;
      return `<button class="ch-card" data-pack="${esc(pack.id)}">
        <svg class="ch-inset" viewBox="0 0 ${map.inset.w} ${map.inset.h}" aria-hidden="true"><path class="ch-land" d="${map.inset.land}"/><path class="ch-hi" d="${map.inset.na}"/></svg>
        <span class="ch-txt"><span class="ch-num">${esc(pack.chapter)}</span><span class="ch-title">${esc(pack.title)}</span>
        <span class="ch-prog"><span class="starred">★</span> ${n} / ${tot}<span class="bar"><i style="width:${100 * n / tot}%"></i></span></span></span>
      </button>`;
    }).join('')}</div></section>`).join('')}`;
  chooserEl.hidden = false;
}
chooserEl.addEventListener('click', e => { const b = e.target.closest('[data-pack]'); if (b) openPack(b.dataset.pack); });

// Keep the open map and round when the page is updated while open
const hot = window.claude && window.claude.hot;
try { hot && hot.snapshot && hot.snapshot(() => (current ? { pack: current.id, ...current.api.snapshot() } : { pack: null })); } catch (e) { /* not in a viewer */ }
const boot = data => { if (data && data.pack) openPack(data.pack, data); else showChooser(); };
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
window.__topoShell = { openPack, showChooser };
})();

</script>
